services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-employee_hub}
      POSTGRES_USER: ${DB_USER:-employee_hub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-employee_hub_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - employee-hub-postgres:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-employee_hub} -d ${DB_NAME:-employee_hub}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  employee-hub-postgres:
